[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trellisdb"
version = "2.0.0"
description = "Tiny embedded document database for Python with N-dimensional coordinate keys."
readme = "README.md"
requires-python = ">=3.11"
# `project.license` as a TOML table is deprecated in setuptools; use SPDX + license-files.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oliver Ernster" }]
keywords = ["database", "embedded", "json", "storage", "coordinates", "multidimensional"]
# The win32 extra brings pywin32 on Windows only: from portalocker 4.0.0 a shared
# lock there needs it and pywin32 is no longer pulled in by default.
dependencies = ["portalocker[win32]>=2.0.0"]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/oernster/TrellisDB"
Repository = "https://github.com/oernster/TrellisDB"
Issues = "https://github.com/oernster/TrellisDB/issues"

[project.optional-dependencies]
server = ["fastapi", "uvicorn"]

[tool.setuptools.packages.find]
where = ["."]
include = ["trellisdb*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
